<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Compressor</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1e1e1e;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    #drop-area {
      border: 3px dashed #555;
      border-radius: 10px;
      margin: 50px auto;
      width: 80%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #aaa;
      transition: border-color 0.3s;
    }
    #log {
      white-space: pre-wrap;
      text-align: left;
      margin: 20px auto;
      width: 80%;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    #progress-container {
      margin-top: 20px;
      width: 80%;
      background: #555;
      border-radius: 5px;
      height: 20px;
      margin: 10px auto;
    }
    #progress-bar {
      background: #4caf50;
      height: 100%;
      width: 0%;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="drop-area">🚀 Drop a folder here with video files to compress</div>
  <div id="log"></div>
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
